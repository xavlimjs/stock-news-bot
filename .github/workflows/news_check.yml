name: Stock News Check

on:
  schedule:
    # Runs every 30 minutes. GitHub may delay this slightly under load -
    # treat it as "roughly every 30 min", not exact.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

permissions:
  contents: write  # needed so the workflow can commit the updated dedup file back

jobs:
  check-news:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run news check
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          NEWSAPI_API_KEY: ${{ secrets.NEWSAPI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_once.py

      - name: Commit updated dedup store
        run: |
          git config user.name "stock-news-bot"
          git config user.email "actions@github.com"
          git add seen_articles.db
          git diff --staged --quiet || git commit -m "Update seen articles [skip ci]"
          git push
